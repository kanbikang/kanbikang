name: Build debug APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk attendance-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-debug-apk
          path: attendance-debug.apk

      - name: Publish as GitHub release (debug-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest attendance-debug.apk \
            --target "$GITHUB_SHA" \
            --title "출퇴근 기록 앱 (디버그 빌드)" \
            --notes "폰에서 attendance-debug.apk 를 내려받아 설치하세요. 빌드 커밋: $GITHUB_SHA"
